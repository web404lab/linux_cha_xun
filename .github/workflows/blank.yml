name: Deploy linux_cha_xun to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure unzip installed
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip site
        run: |
          if [ -f linux_cha_xun.zip ]; then
            mkdir -p site
            unzip -o linux_cha_xun.zip -d site
            # If the zip contains a single root folder, move its contents up
            ROOT_DIR=$(find site -maxdepth 1 -mindepth 1 -type d | head -n 1 || true)
            if [ -d "$ROOT_DIR" ]; then
              mv "$ROOT_DIR"/* site/ || true
            fi
          else
            echo "linux_cha_xun.zip not found"
            exit 1
          fi

      - name: List files
        run: ls -la site | sed -n '1,200p'

      - name: Deploy to gh-pages (workaround)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          allow_empty_commit: true
          keep_files: true
          enable_jekyll: false
